[project]
name = "light-hr-backend"
version = "0.1.0"
description = "LIGHT HRMS WEB APPLICATION"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
