[project]
name = "light-hr-backend"
version = "0.1.0"
description = "LIGHT HRMS WEB APPLICATION"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
